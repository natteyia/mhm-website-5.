<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#041923" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MHM Group — Website Under Construction</title>
    <style>
      :root {
        --ink: #041923;
        --navy: #082f43;
        --blue: #0e6d96;
        --cyan: #24b9d5;
        --paper: #f6fbfd;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        color: white;
        background:
          radial-gradient(circle at 18% 18%, rgba(36,185,213,.18), transparent 28rem),
          radial-gradient(circle at 82% 82%, rgba(14,109,150,.28), transparent 31rem),
          linear-gradient(145deg, var(--ink), var(--navy));
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow-x: hidden;
      }

      .page {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(28px, 5vw, 72px);
        isolation: isolate;
      }

      .page::before,
      .page::after {
        content: "";
        position: fixed;
        z-index: -1;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,.09);
        pointer-events: none;
      }

      .page::before { width: 58vw; height: 58vw; left: -30vw; top: -34vw; }
      .page::after { width: 48vw; height: 48vw; right: -24vw; bottom: -30vw; }

      main {
        width: min(1120px, 100%);
        display: grid;
        grid-template-columns: minmax(280px, .82fr) minmax(380px, 1.18fr);
        gap: clamp(44px, 8vw, 112px);
        align-items: center;
      }

      .identity { display: grid; justify-items: center; }

      .group-logo {
        width: min(300px, 72vw);
        aspect-ratio: 1 / 1.24;
        padding: 9%;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,.98);
        border-radius: 42% 58% 54% 46% / 45% 42% 58% 55%;
        box-shadow: 0 35px 90px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.8);
        animation: breathe 7s ease-in-out infinite;
      }

      .group-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .content { min-width: 0; }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        color: #9fe9f5;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .28em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 42px;
        height: 2px;
        background: var(--cyan);
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.4rem, 8vw, 7.8rem);
        font-weight: 400;
        line-height: .86;
        letter-spacing: -.055em;
      }

      h1 span { display: block; color: #7ee1ef; }

      .rule {
        width: min(100%, 620px);
        height: 1px;
        margin: clamp(32px, 5vw, 54px) 0 28px;
        background: linear-gradient(90deg, rgba(126,225,239,.75), rgba(255,255,255,.07));
      }

      .companies {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .company {
        min-height: 104px;
        display: grid;
        place-items: center;
        padding: 15px;
        border-radius: 18px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 14px 32px rgba(0,0,0,.17);
        transition: transform .25s ease, box-shadow .25s ease;
      }

      .company:hover {
        transform: translateY(-5px);
        box-shadow: 0 22px 42px rgba(0,0,0,.25);
      }

      .company img {
        display: block;
        width: 100%;
        height: 74px;
        object-fit: contain;
      }

      .company--sedra img { height: 82px; }

      @keyframes breathe {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      @media (max-width: 820px) {
        .page { padding-block: 48px; }
        main { grid-template-columns: 1fr; text-align: center; }
        .group-logo { width: min(190px, 52vw); }
        .eyebrow { justify-content: center; }
        h1 { margin-inline: auto; font-size: clamp(3.1rem, 16vw, 5.4rem); }
        .rule { margin-inline: auto; }
        .companies { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 430px) {
        .page { padding-inline: 18px; }
        main { gap: 36px; }
        .company { min-height: 92px; padding: 12px; }
        .company img { height: 64px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main>
        <section class="identity" aria-label="MHM Group">
          <div class="group-logo">
            <img src="assets/mhm.jpeg" alt="MHM Group" />
          </div>
        </section>

        <section class="content">
          <div class="eyebrow">MHM Group</div>
          <h1>Website <span>Under Construction</span></h1>
          <div class="rule"></div>

          <div class="companies" aria-label="Group companies">
            <div class="company company--sedra"><img src="assets/sedra.png" alt="Sedra Travel" /></div>
            <div class="company"><img src="assets/pulse.jpeg" alt="Pulse" /></div>
            <div class="company"><img src="assets/mrc-gulf.jpeg" alt="MRC Gulf" /></div>
            <div class="company"><img src="assets/ims.jpeg" alt="IMS" /></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
